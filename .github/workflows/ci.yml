name: ADL-Nexus CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  docs-presence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required governance files
        run: |
          test -f README.md
          test -f docs/GOVERNANCE.md
          test -f docs/CLAIM_STATUS.md
          grep -q "UNSUPPORTED" docs/CLAIM_STATUS.md
          grep -q "RESEARCH" docs/CLAIM_STATUS.md
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -q
